name: 功能请求
description: 提出范围明确的 ToolSpan 改进
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 描述用户问题，不预先规定大型解决方案。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 最小可用结果
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: 产品边界
      options:
        - 符合现有 Core server 契约
        - 文档或操作者体验
        - 不确定，需要边界评审
    validations:
      required: true
  - type: checkboxes
    id: non_goals
    attributes:
      label: 范围确认
      options:
        - label: 这不需要任意 Shell、MCP Client、Gateway、Agent Runtime、聊天功能或公网管理路由。
          required: true
        - label: 我没有包含 Secret、私人路径、账号 ID 或用户数据。
          required: true
  - type: textarea
    id: verification
    attributes:
      label: 可验证的验收结果
      description: 说明确定性测试如何证明该结果。
    validations:
      required: true
