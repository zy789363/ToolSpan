name: Feature request
description: Propose a scoped ToolSpan improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without prescribing a large solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Smallest useful outcome
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Product boundary
      options:
        - Fits the existing Core server contract
        - Documentation or operator experience
        - Unsure and needs boundary review
    validations:
      required: true
  - type: checkboxes
    id: non_goals
    attributes:
      label: Scope confirmation
      options:
        - label: This does not require an arbitrary Shell, MCP Client, Gateway, Agent Runtime, chat feature, or public admin route.
          required: true
        - label: I have not included secrets, private paths, account IDs, or user data.
          required: true
  - type: textarea
    id: verification
    attributes:
      label: Verifiable acceptance result
      description: State how a deterministic test could prove the outcome.
    validations:
      required: true
