[package]
name = "toolspan-desktop"
version = "0.7.1"
description = "ToolSpan desktop security shell"
edition = "2024"
rust-version = "1.85"
license-file = "../../../LICENSE"
build = "build.rs"

[lib]
name = "toolspan_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "toolspan-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
bcrypt = "=0.17.1"
dunce = "=1.0.5"
rand = "=0.9.2"
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
thiserror = "=2.0.17"
time = { version = "=0.3.45", features = ["formatting"] }
url = "=2.5.7"
zeroize = "=1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
